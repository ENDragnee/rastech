name: rastech

services:
  postgres:
    image: postgres:18.3
    container_name: rastech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rastech
      POSTGRES_PASSWORD: qazwsxedc
      POSTGRES_DB: rastech
    ports:
      - "5432:5432"
    volumes:
      - rastech-postgres-vol:/var/lib/postgresql
    networks:
      - rastech-network

  rastech:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rastech-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - rastech-network
    depends_on:
      - postgres

volumes:
  rastech-postgres-vol:

networks:
  rastech-network:
    driver: bridge
